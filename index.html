<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aurya — Comanda Garçom</title>

    <!-- PWA: manifest + cores + comportamento "app-like" no celular -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08101f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurya Garçom" />
    <link rel="apple-touch-icon" href="/Aurya.jpeg" />
    <link rel="icon" type="image/png" href="/logoAurya.png" />
  </head>
  <body>
    <!-- É aqui dentro desta div que o React vai injetar toda a nossa aplicação -->
    <div id="root"></div>

    <!-- Este script é a ponte que liga o HTML ao nosso código React (App.tsx) -->
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Service Worker — registra APENAS em produção HTTPS.
      Em dev (localhost / 127.0.0.1 / IP local), o SW interfere no HMR do Vite
      (WebSocket de hot reload), então nunca registra em dev. Se algum dev tiver
      registrado um SW antes, este script desregistra automaticamente.
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var ehLocalhost =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          /^192\.168\./.test(location.hostname) ||
          /^10\./.test(location.hostname);
        var ehHttps = location.protocol === 'https:';

        if (ehLocalhost || !ehHttps) {
          // Dev: garante que nenhum SW antigo fique segurando o HMR do Vite
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          }).catch(function () {});
          return;
        }

        // Produção HTTPS: registra normalmente
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* silencioso — falha de SW não impede uso normal do site */
          });
        });
      })();
    </script>
  </body>
</html>
